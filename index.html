document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<style>\n:root{\n--color-bg:oklch(0.962 0.008 75);--color-surface:oklch(0.93 0.011 75);--color-text:oklch(0.23 0.012 60);\n--color-divider:color-mix(in srgb,oklch(0.23 0.012 60) 16%,transparent);\n--color-neutral-100:oklch(0.975 0.006 75);--color-neutral-200:oklch(0.93 0.01 75);--color-neutral-300:oklch(0.87 0.012 75);--color-neutral-400:oklch(0.78 0.013 70);--color-neutral-500:oklch(0.68 0.014 70);--color-neutral-600:oklch(0.58 0.014 65);--color-neutral-700:oklch(0.48 0.014 65);--color-neutral-800:oklch(0.38 0.013 60);--color-neutral-900:oklch(0.29 0.012 60);\n--color-accent:oklch(0.58 0.07 235);--color-accent-100:oklch(0.96 0.02 235);--color-accent-200:oklch(0.91 0.035 235);--color-accent-300:oklch(0.84 0.05 235);--color-accent-600:oklch(0.53 0.07 235);--color-accent-700:oklch(0.46 0.065 235);--color-accent-800:oklch(0.37 0.055 235);--color-accent-900:oklch(0.28 0.035 245)}\nbody{margin:0}\na{color:var(--color-accent-700)}\na:hover{color:var(--color-accent-800)}\n<\u002Fstyle>\n<style>\n/* site layout: header, section heads, research grid, tools, footer, legal */\n.site-header{position:sticky;top:0;z-index:10}\nsection[id],details[id]{scroll-margin-top:80px}\n.sec-num{font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1;letter-spacing:0.04em;color:var(--color-accent-700)}\n@media (min-width:900px){.sec-head{position:sticky;top:104px;align-self:flex-start}}\n.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));overflow:hidden}\n.rgrid>.card{border:0;box-shadow:1px 0 0 var(--color-divider),0 1px 0 var(--color-divider)}\n.tool-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,2.6fr) auto;gap:20px;align-items:baseline}\n.foot-links>*{white-space:nowrap}\n.pub-row{display:grid;grid-template-columns:88px minmax(0,1fr)}\n.pub-year{padding:20px 24px 0 0}\n.legal>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0}\n.legal>summary::-webkit-details-marker{display:none}\n.legal>summary .chev{font-size:24px;line-height:1;color:var(--color-accent-700);transition:transform .15s}\n.legal[open]>summary .chev{transform:rotate(45deg)}\n.legal>summary:hover .lt{color:var(--color-accent-700)}\n@media (max-width:720px){.brand-tag{display:none}}\n@media (max-width:600px){\n  .site-header{position:static}\n  .tool-row{grid-template-columns:1fr auto;gap:6px 16px}\n  .tool-row .tool-desc{grid-column:1/-1;grid-row:2}\n  .pub-row{grid-template-columns:60px minmax(0,1fr)}\n  .pub-year{padding-right:12px}\n}\n<\u002Fstyle>\n<style>\n/* hero image: squeeze to the band instead of cropping */\n.hero-img{object-fit:cover;object-position:center}\n@media (min-width:900px){.hero-img{object-fit:fill}}\n<\u002Fstyle>\n<style>\n/* research areas */\n.ra-kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)}\n.ra-t{font-family:var(--font-heading);font-size:24px;font-weight:600;line-height:1.15;margin:0}\n.ra-b{font-size:15px;line-height:1.6;color:var(--color-neutral-800);margin:0;text-wrap:pretty}\n.ra-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px 48px}\n.ra-big{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:3px solid var(--color-accent-700)}\n.ra-big .ra-t{font-size:30px}\n.ra-big .ra-b{font-size:16.5px}\n.ra-rest{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px 48px;margin-top:44px}\n.ra-small{display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:1px solid var(--color-divider)}\n.ra-small .ra-t{font-size:19px}\n.ra-small .ra-b{font-size:14px;line-height:1.55}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n  <header class=\"site-header\" style=\"background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-divider)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap\">\n      <a href=\"#top\" style=\"text-decoration:none;color:var(--color-text);display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap\">\n        <img src=\"673be1b5-0f74-4f03-adee-1151948f4c26\" alt=\"Sachsenberg Lab\" style=\"height:44px;width:auto;display:block\">\n        <span class=\"brand-tag\" style=\"font-family:var(--font-heading);font-weight:600;font-size:17px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-800);white-space:nowrap;padding-left:16px;border-left:1px solid var(--color-divider)\">Scalable Computational Mass Spectrometry<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;gap:24px;flex-wrap:wrap;font-family:var(--font-heading);font-size:16px;font-weight:600\">\n        <a href=\"#research\" style=\"text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-accent)\">Research<\u002Fa>\n        <sc-if value=\"{{ showTeam }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#team\" style=\"text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-accent)\">Team<\u002Fa><\u002Fsc-if>\n        <a href=\"#publications\" style=\"text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-accent)\">Publications<\u002Fa>\n        <a href=\"#contact\" style=\"text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-accent)\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"hero-band\" style=\"position:relative;overflow:hidden;background:#1a0a2a\">\n    <img class=\"hero-img\" src=\"945acdd3-6f9e-43b3-a9b9-bbf743ca6ff2\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n    <section id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;max-width:1200px;margin:0 auto;padding:clamp(44px,5vw,64px) 32px clamp(40px,4.5vw,56px)\">\n      <div style=\"position:relative;isolation:isolate;max-width:fit-content\">\n        <div aria-hidden=\"true\" style=\"position:absolute;z-index:-1;left:-80px;right:-108px;top:-1000px;bottom:-1000px;background:rgba(20,6,40,.74);filter:blur(40px);pointer-events:none\"><\u002Fdiv>\n        <h1 style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(40px,5.2vw,76px);line-height:0.96;letter-spacing:-0.02em;margin:0;color:var(--color-bg);max-width:20ch;text-wrap:balance\">Turning spectra into biological insight.<\u002Fh1>\n        <p style=\"font-size:18px;line-height:1.55;color:var(--color-neutral-200);max-width:60ch;margin:20px 0 0;text-wrap:pretty\">We are a small, focused group at the Institute for Bioinformatics and Medical Informatics, University of Tübingen, developing algorithms and open-source software for mass spectrometry data in proteomics, metabolomics and structural biology — built to scale from a laptop to the cloud.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <section id=\"research\" data-screen-label=\"Research\" style=\"border-top:1px solid var(--color-divider)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-wrap:wrap;gap:32px 48px\">\n      <div class=\"sec-head\" style=\"flex:1 1 180px\">\n        <div class=\"sec-num\">01<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-heading);font-size:40px;font-weight:600;margin:10px 0 0\">Research<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex:3 1 480px;min-width:0;display:flex;flex-direction:column;gap:56px\">\n        <div>\n          <div class=\"ra-top\">\n            <sc-for list=\"{{ researchTop }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div class=\"ra-big\">\n              <div class=\"ra-kick\">{{ r.tag }}<\u002Fdiv>\n              <h3 class=\"ra-t\">{{ r.title }}<\u002Fh3>\n              <p class=\"ra-b\">{{ r.body }}<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"ra-rest\">\n            <sc-for list=\"{{ researchRest }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div class=\"ra-small\">\n              <div class=\"ra-kick\">{{ r.tag }}<\u002Fdiv>\n              <h3 class=\"ra-t\">{{ r.title }}<\u002Fh3>\n              <p class=\"ra-b\">{{ r.body }}<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px\">\n            <h3 style=\"font-family:var(--font-heading);font-size:24px;font-weight:600;margin:0\">Open-source tools<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ software }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <a href=\"{{ s.url }}\" class=\"tool-row\" style=\"text-decoration:none;color:var(--color-text);padding:18px 0;border-top:1px solid var(--color-divider)\" style-hover=\"color:var(--color-accent-700)\">\n                <span style=\"font-family:var(--font-heading);font-size:22px;font-weight:600\">{{ s.name }}<\u002Fspan>\n                <span class=\"tool-desc\" style=\"font-size:15px;line-height:1.55;color:var(--color-neutral-800)\">{{ s.body }}<\u002Fspan>\n                <span style=\"font-size:14px;color:var(--color-accent-700)\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTeam }}\" hint-placeholder-val=\"{{ false }}\"><section id=\"team\" data-screen-label=\"Team\" style=\"border-top:1px solid var(--color-divider)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-wrap:wrap;gap:32px 48px\">\n      <div class=\"sec-head\" style=\"flex:1 1 180px\">\n        <div class=\"sec-num\">02<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-heading);font-size:40px;font-weight:600;margin:10px 0 0\">Team<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex:3 1 480px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:36px 24px\">\n        <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"6\">\n          <div>\n            <div class=\"blueprint duotone\" style=\"aspect-ratio:4/5;background:repeating-linear-gradient(135deg,var(--color-neutral-200) 0 6px,var(--color-bg) 6px 12px);display:flex;align-items:flex-end;padding:10px;font-family:ui-monospace,monospace;font-size:11px;color:var(--color-neutral-700)\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>portrait\n            <\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600;margin-top:14px\">{{ m.name }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:var(--color-neutral-700);margin-top:2px\">{{ m.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><\u002Fsc-if>\n\n  <section id=\"publications\" data-screen-label=\"Publications\" style=\"border-top:1px solid var(--color-divider)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-wrap:wrap;gap:32px 48px\">\n      <div class=\"sec-head\" style=\"flex:1 1 180px\">\n        <div class=\"sec-num\">{{ nPub }}<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-heading);font-size:40px;font-weight:600;margin:10px 0 0\">Publications<\u002Fh2>\n        <a href=\"https://scholar.google.de/citations?user=7H4EQacAAAAJ&amp;hl=en\" style=\"display:inline-block;font-size:14px;margin-top:14px\">Full list on Google Scholar →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:3 1 480px;min-width:0;display:flex;flex-direction:column\">\n        <sc-for list=\"{{ pubs }}\" as=\"p\" hint-placeholder-count=\"12\">\n          <div class=\"pub-row\">\n            <span class=\"pub-year\" style=\"font-family:var(--font-heading);font-size:20px;font-weight:600;color:var(--color-accent-700);border-top:1px solid {{ p.yearRule }}\">{{ p.yearLabel }}<\u002Fspan>\n            <div style=\"padding:20px 0;border-top:1px solid {{ p.rowRule }}\">\n              <a href=\"{{ p.url }}\" style=\"display:block;font-size:17px;font-weight:500;line-height:1.4;text-wrap:pretty;color:var(--color-text);text-decoration:none\" style-hover=\"color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px\">{{ p.title }}&nbsp;<span aria-hidden=\"true\" style=\"font-size:14px;color:var(--color-accent-700)\">↗<\u002Fspan><\u002Fa>\n              <div style=\"font-size:14px;color:var(--color-neutral-700);margin-top:6px\">{{ p.a1 }}<strong style=\"font-weight:600;color:var(--color-text);white-space:nowrap\">{{ p.me }}<\u002Fstrong>{{ p.a2 }} · <em>{{ p.venue }}<\u002Fem><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"background:var(--color-accent-900);color:var(--color-bg)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:88px 32px;display:flex;flex-wrap:wrap;gap:32px 48px\">\n      <div style=\"flex:1 1 180px\">\n        <div class=\"sec-num\" style=\"color:var(--color-accent-300)\">{{ nContact }}<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-heading);font-size:40px;font-weight:600;margin:10px 0 0\">Contact<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex:3 1 480px;min-width:0\">\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(28px,3.4vw,42px);line-height:1.15;margin:0;max-width:26ch;text-wrap:pretty\">Interested in a collaboration? Write to us.<\u002Fp>\n        <a href=\"#contact\" sc-camel-on-click=\"{{ sendMail }}\" style=\"display:inline-block;margin-top:28px;font-size:clamp(18px,2vw,24px);color:var(--color-accent-200);word-break:break-all\" style-hover=\"color:var(--color-bg)\">{{ emailText }}<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Rechtliches\" style=\"border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 32px\">\n      <details id=\"impressum\" class=\"legal\">\n        <summary><span class=\"lt\" style=\"font-family:var(--font-heading);font-size:22px;font-weight:600\">Impressum<\u002Fspan><span class=\"chev\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"display:flex;flex-wrap:wrap;gap:0 48px;padding:0 0 44px\">\n          <div style=\"flex:1 1 180px\"><\u002Fdiv>\n          <div style=\"flex:3 1 480px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:28px 40px;font-size:14px;line-height:1.65;color:var(--color-neutral-800)\">\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Anbieter und inhaltlich verantwortlich<\u002Fh3>\n          <p style=\"margin:0\">Timo Sachsenberg<br>c/o Universität Tübingen<br>Institut für Bioinformatik und Medizininformatik<br>Maria-von-Linden-Straße 6, Raum 20-5-A7<br>72076 Tübingen<br>Deutschland<\u002Fp>\n          <p style=\"margin:12px 0 0\">E-Mail: <a href=\"#contact\" sc-camel-on-click=\"{{ sendMail }}\">{{ emailText }}<\u002Fa><br>Telefon: <a href=\"{{ phoneHref }}\">{{ phoneText }}<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Hinweis zum Betreiber<\u002Fh3>\n          <p style=\"margin:0;text-wrap:pretty\">Diese Website wird von Timo Sachsenberg in eigener Verantwortung betrieben. Sie ist kein offizieller Webauftritt der Universität Tübingen.<\u002Fp>\n          <p style=\"margin:12px 0 0;text-wrap:pretty\">Die Nennung der Universität Tübingen dient der Darstellung der wissenschaftlichen Zugehörigkeit.<\u002Fp>\n        <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details id=\"datenschutz\" class=\"legal\" style=\"border-top:1px solid var(--color-divider)\">\n        <summary><span class=\"lt\" style=\"font-family:var(--font-heading);font-size:22px;font-weight:600\">Datenschutzerklärung<\u002Fspan><span class=\"chev\" aria-hidden=\"true\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"display:flex;flex-wrap:wrap;gap:0 48px;padding:0 0 44px\">\n          <div style=\"flex:1 1 180px\"><\u002Fdiv>\n          <div style=\"flex:3 1 480px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:28px 40px;font-size:14px;line-height:1.65;color:var(--color-neutral-800)\">\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Verantwortlicher<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Timo Sachsenberg, Anschrift und E-Mail siehe Impressum. Diese Website ist ein privates Angebot und keine offizielle Seite der Universität Tübingen.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Hosting<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Diese Website wird bei GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA) gehostet. Beim Aufruf verarbeitet GitHub technisch notwendige Daten wie IP-Adresse, Zeitpunkt, aufgerufene Seite und Browserinformationen in Server-Logfiles, um die Seite auszuliefern und die Sicherheit zu gewährleisten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Eine Übermittlung in die USA erfolgt auf Grundlage des EU-US Data Privacy Framework. Details: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\">GitHub Privacy Statement<\u002Fa>.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Keine Cookies, kein Tracking<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Diese Website setzt keine Cookies und verwendet keine Analyse- oder Tracking-Dienste. Schriftarten werden lokal von diesem Server geladen; es findet keine Verbindung zu Google Fonts statt.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Kontakt per E-Mail<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Wenn Sie uns per E-Mail kontaktieren, werden Ihre Angaben zur Bearbeitung der Anfrage verarbeitet (Art. 6 Abs. 1 lit. f DSGVO) und gelöscht, sobald sie nicht mehr erforderlich sind. Die angegebene Adresse ist ein Postfach der Universität Tübingen; E-Mails werden daher über deren E-Mail-System übermittelt und gespeichert.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Externe Links<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Links zu externen Seiten (z. B. GitHub, Google Scholar, DOI) werden erst beim Anklicken aufgerufen. Ab dann gelten die Datenschutzbestimmungen des jeweiligen Anbieters.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Ihre Rechte<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch und Datenübertragbarkeit (Art. 15–21 DSGVO) sowie ein Beschwerderecht bei einer Aufsichtsbehörde, z. B. dem Landesbeauftragten für den Datenschutz und die Informationsfreiheit Baden-Württemberg.<\u002Fp><\u002Fdiv>\n        <div><h3 style=\"font-family:var(--font-heading);font-size:18px;font-weight:600;margin:0 0 6px;color:var(--color-text)\">Widerspruchsrecht<\u002Fh3><p style=\"margin:0;text-wrap:pretty\">Soweit Daten auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO verarbeitet werden, können Sie dieser Verarbeitung aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit widersprechen (Art. 21 Abs. 1 DSGVO). Eine formlose Nachricht an die im Impressum genannte Adresse genügt.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width:1200px;margin:0 auto;padding:32px;display:flex;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;font-size:13px;color:var(--color-neutral-700)\">\n    <span>Sachsenberg Lab · University of Tübingen<\u002Fspan>\n    <div class=\"foot-links\" style=\"display:flex;flex-wrap:wrap;gap:8px 20px\">\n      <a href=\"https://github.com/SachsenbergLab\">GitHub<\u002Fa>\n      <a href=\"https://scholar.google.de/citations?user=7H4EQacAAAAJ&amp;hl=en\">Google Scholar<\u002Fa>\n      <a href=\"#impressum\" sc-camel-on-click=\"{{ openLegal }}\">Impressum<\u002Fa>\n      <a href=\"#datenschutz\" sc-camel-on-click=\"{{ openLegal }}\">Datenschutz<\u002Fa>\n      <span>© 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Warm steel&quot;,&quot;Industry grey&quot;,&quot;Sage&quot;,&quot;Terracotta&quot;,&quot;Plum&quot;],&quot;default&quot;:&quot;Plum&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showTeam&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { email: '', phone: [] };\n  applyPalette() {\n    const P = {\n      'Warm steel': null,\n      'Industry grey': { bg: '#f2f2f3', surface: '#e9e9ea', text: '#1d1f20', nh: 270, nc: 0.006, ah: 250, ac: 0.07 },\n      'Sage': { bg: 'oklch(0.962 0.008 110)', surface: 'oklch(0.93 0.011 110)', text: 'oklch(0.23 0.012 120)', nh: 110, nc: 0.012, ah: 155, ac: 0.06 },\n      'Terracotta': { bg: 'oklch(0.965 0.01 70)', surface: 'oklch(0.93 0.014 70)', text: 'oklch(0.23 0.014 50)', nh: 65, nc: 0.015, ah: 40, ac: 0.1 },\n      'Plum': { bg: 'oklch(0.962 0.008 330)', surface: 'oklch(0.93 0.01 330)', text: 'oklch(0.23 0.012 320)', nh: 330, nc: 0.012, ah: 320, ac: 0.07 }\n    };\n    const s = document.documentElement.style;\n    const keys = ['bg', 'surface', 'text', 'divider', ...[100,200,300,400,500,600,700,800,900].map(n => 'neutral-' + n), '', ...[100,200,300,600,700,800,900].map(n => 'accent-' + n)];\n    const p = P[this.props.palette ?? 'Plum'];\n    if (!p) { keys.forEach(k => s.removeProperty(k === '' ? '--color-accent' : '--color-' + k)); return; }\n    const L = { 100: 0.975, 200: 0.93, 300: 0.87, 400: 0.78, 500: 0.68, 600: 0.58, 700: 0.48, 800: 0.38, 900: 0.29 };\n    s.setProperty('--color-bg', p.bg); s.setProperty('--color-surface', p.surface); s.setProperty('--color-text', p.text);\n    s.setProperty('--color-divider', `color-mix(in srgb, ${p.text} 16%, transparent)`);\n    Object.entries(L).forEach(([n, l]) => s.setProperty('--color-neutral-' + n, `oklch(${l} ${p.nc} ${p.nh})`));\n    const A = { '': [0.58, 1], 100: [0.96, 0.3], 200: [0.91, 0.5], 300: [0.84, 0.7], 600: [0.53, 1], 700: [0.46, 0.93], 800: [0.37, 0.8], 900: [0.28, 0.55] };\n    Object.entries(A).forEach(([n, [l, k]]) => s.setProperty(n === '' ? '--color-accent' : '--color-accent-' + n, `oklch(${l} ${(p.ac * k).toFixed(3)} ${p.ah})`));\n  }\n  componentDidUpdate(prev) { if (prev.palette !== this.props.palette) this.applyPalette(); }\n  componentDidMount() {\n    this.applyPalette();\n    const openFromHash = (scroll) => {\n      const id = window.location.hash.slice(1);\n      if (id !== 'impressum' && id !== 'datenschutz') return;\n      const el = document.getElementById(id);\n      if (!el) return;\n      el.open = true;\n      if (scroll) el.scrollIntoView();\n    };\n    openFromHash(true);\n    window.addEventListener('hashchange', () => openFromHash(false));\n    const u = ['timo', 'sachsenberg'].join('.'), d = ['uni-tuebingen', 'de'].join('.');\n    this.setState({ email: u + String.fromCharCode(64) + d, phone: [49, 7071, 29, 70461] });\n  }\n  groupPubs(list) {\n    const ME = 'Sachsenberg T';\n    let prev = null;\n    return list.map((p) => {\n      const first = p.year !== prev;\n      prev = p.year;\n      const i = p.authors.indexOf(ME);\n      return {\n        ...p,\n        yearLabel: first ? p.year : '',\n        yearRule: first ? 'var(--color-divider)' : 'transparent',\n        rowRule: first ? 'var(--color-divider)' : 'color-mix(in srgb, var(--color-text) 8%, transparent)',\n        a1: i < 0 ? p.authors : p.authors.slice(0, i),\n        me: i < 0 ? '' : ME,\n        a2: i < 0 ? '' : p.authors.slice(i + ME.length)\n      };\n    });\n  }\n  renderVals() {\n    const email = this.state.email;\n    return {\n      showTeam: this.props.showTeam ?? false,\n      nPub: (this.props.showTeam ?? false) ? '03' : '02',\n      nContact: (this.props.showTeam ?? false) ? '04' : '03',\n      emailText: email || 'timo.sachsenberg [at] uni-tuebingen [dot] de',\n      phoneText: this.state.phone.length ? '+' + this.state.phone.join(' ') : '',\n      phoneHref: this.state.phone.length ? 'tel:+' + this.state.phone.join('') : '#impressum',\n      openLegal: (e) => {\n        const el = document.getElementById((e.currentTarget.getAttribute('href') || '').slice(1));\n        if (el) el.open = true;\n      },\n      sendMail: (e) => { if (!email) return; e.preventDefault(); window.location.href = 'mai' + 'lto:' + email; },\n      research: (this._research = [\n        { tag: 'Proteomics', title: 'Identification & quantification', body: 'Scalable workflows for peptide identification, label-free and isobaric quantification across thousands of runs.' },\n        { tag: 'Crosslinking', title: 'Protein–nucleic acid interactions', body: 'Algorithms that localise RNA- and DNA-binding sites on proteins from crosslinking MS data.' },\n        { tag: 'Metabolomics', title: 'Small-molecule analysis', body: 'Feature detection, alignment and annotation for untargeted metabolomics.' },\n        { tag: 'Infrastructure', title: 'Reproducible pipelines', body: 'Containerised, cloud-ready workflows that make large-scale MS analysis reproducible.' },\n        { tag: 'Machine learning', title: 'Learning from spectra', body: 'Models that predict and rescore spectra to boost identification rates and confidence.' },\n        { tag: 'Immunopeptidomics', title: 'HLA peptide discovery', body: 'Methods for identifying HLA-presented peptides to support immunology and vaccine research.' }\n      ]),\n      researchTop: this._research.slice(0, 2),\n      researchRest: this._research.slice(2),\n      software: [\n        { name: 'OpenMS', body: 'Open-source C++ library and toolset for LC-MS data analysis.', url: 'https://openms.de' },\n        { name: 'pyOpenMS', body: 'Python bindings for rapid prototyping and scripting with OpenMS.', url: 'https://pyopenms.readthedocs.io' },\n        { name: 'NuXL', body: 'Search engine for protein–RNA/DNA crosslinking mass spectrometry.', url: 'https://openms.de/applications/nuxl/' },\n        { name: 'quantms', body: 'Cloud-scale quantitative proteomics pipeline built on nf-core.', url: 'https://github.com/bigbio/quantms' },\n        { name: 'MetaProSIP', body: 'Detection and quantification of stable isotope incorporation in metaproteomics (protein-SIP).', url: 'https://openms.de/documentation/html/TOPP_MetaProSIP.html' },\n        { name: 'OnSite', body: 'Localization of post-translational modification sites from MS/MS spectra.', url: 'https://github.com/bigbio/onsite' }\n      ],\n      team: [\n        { name: 'Timo Sachsenberg', role: 'Group leader' },\n        { name: 'Name Surname', role: 'Postdoc' },\n        { name: 'Name Surname', role: 'PhD student' },\n        { name: 'Name Surname', role: 'PhD student' },\n        { name: 'Name Surname', role: 'Research software engineer' },\n        { name: 'Name Surname', role: 'Master student' }\n      ],\n      pubs: this.groupPubs([\n        { year: '2026', title: \"pmultiqc: An open-source, lightweight, and metadata-oriented QC reporting library for MS proteomics\", authors: \"Yue QX, Dai C, Kamatchinathan S, … Sachsenberg T, Bielow C, Bai M, Perez-Riverol Y\", venue: \"Molecular & Cellular Proteomics\", url: 'https://doi.org/10.1016/j.mcpro.2026.101530' },\n        { year: '2025', title: \"Perspectives in computational mass spectrometry: recent developments and key challenges\", authors: \"Sachsenberg T, Pino LK, Brunet M, Bludau I, Kohlbacher O, Vizcaino JA, Bittremieux W\", venue: \"Bioinformatics Advances\", url: 'https://doi.org/10.1093/bioadv/vbaf301' },\n        { year: '2025', title: \"A universal language for finding mass spectrometry data patterns\", authors: \"Damiani T, Jarmusch AK, Aron AT, … Sachsenberg T, … Dorrestein PC, Wang M\", venue: \"Nature Methods\", url: 'https://doi.org/10.1038/s41592-025-02660-z' },\n        { year: '2025', title: \"pyOpenMS-viz: Streamlining mass spectrometry data visualization with pandas\", authors: \"Sing JC, Charkow J, Walter A, Gao M, Müller TD, Bittremieux W, Sachsenberg T, Röst HL\", venue: \"Journal of Proteome Research\", url: 'https://doi.org/10.1021/acs.jproteome.4c00873' },\n        { year: '2025', title: \"OpenMS WebApps: Building user-friendly solutions for MS analysis\", authors: \"Müller TD, Siraj A, Walter A, … Röst HL, Sachsenberg T\", venue: \"Journal of Proteome Research\", url: 'https://doi.org/10.1021/acs.jproteome.4c00872' },\n        { year: '2025', title: \"Ibaqpy: A scalable Python package for baseline quantification in proteomics leveraging SDRF metadata\", authors: \"Zheng P, Audain E, Webel H, … Sachsenberg T, Bai M, Perez-Riverol Y\", venue: \"Journal of Proteomics\", url: 'https://doi.org/10.1016/j.jprot.2025.105440' },\n        { year: '2024', title: \"OpenMS 3 enables reproducible analysis of large-scale mass spectrometry data\", authors: \"Pfeuffer J, Bielow C, Wein S, … Röst H, Kohlbacher O, Sachsenberg T\", venue: \"Nature Methods\", url: 'https://doi.org/10.1038/s41592-024-02197-7' },\n        { year: '2024', title: \"quantms: A cloud-based pipeline for quantitative proteomics enables the reanalysis of public proteomics data\", authors: \"Dai C, Pfeuffer J, Wang H, … Sachsenberg T, … Kohlbacher O, Perez-Riverol Y\", venue: \"Nature Methods\", url: 'https://doi.org/10.1038/s41592-024-02343-1' },\n        { year: '2024', title: \"Intensity and retention time prediction improves the rescoring of protein–nucleic acid cross-links\", authors: \"Siraj A, Bouwmeester R, Declercq A, … Kohlbacher O, Sachsenberg T\", venue: \"Proteomics\", url: 'https://doi.org/10.1002/pmic.202300144' },\n        { year: '2023', title: \"LFQ-based peptide and protein intensity differential expression analysis\", authors: \"Bai M, Deng J, Dai C, Pfeuffer J, Sachsenberg T, Perez-Riverol Y\", venue: \"Journal of Proteome Research\", url: 'https://doi.org/10.1021/acs.jproteome.2c00812' },\n        { year: '2023', title: \"Tissue-based absolute quantification using large-scale TMT and LFQ experiments\", authors: \"Wang H, Dai C, Pfeuffer J, Sachsenberg T, Sanchez A, Bai M, Perez-Riverol Y\", venue: \"Proteomics\", url: 'https://doi.org/10.1002/pmic.202300188' },\n        { year: '2021', title: \"A proteomics sample metadata representation for multiomics integration and big data analysis\", authors: \"Dai C, Füllgrabe A, Pfeuffer J, … Sachsenberg T, Levitsky LI, Perez-Riverol Y\", venue: \"Nature Communications\", url: 'https://doi.org/10.1038/s41467-021-26111-3' }\n      ])\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
